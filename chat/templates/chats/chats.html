{% load static %}
{% load pwa %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Your Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- PWA Meta Tags -->
    {% progressive_web_app_meta %}
    <link rel="icon" type="image/png" href="{% static 'img/aice_192x192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/aice_192x192.png' %}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">🤖 AI Assistant</h1>

        <!-- Offline Banner -->
        <div id="offline-banner" class="alert alert-warning d-none" role="alert">
            ⚠️ You are offline. Some features may be unavailable.
        </div>

        <!-- Chat UI -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div id="chat-box" class="mb-3"></div>

                <div class="input-group">
                    <input type="text" id="prompt-input" class="form-control" 
                           placeholder="Type your question...">
                    <button id="send-btn" class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Your Custom JS (This handles all the chat logic now) -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
